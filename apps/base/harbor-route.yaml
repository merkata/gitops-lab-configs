apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: lab
      namespace: platform
      sectionName: http
  hostnames:
    - harbor.127.0.0.1.nip.io
  rules:
    - backendRefs:
        - name: harbor
          port: 80
