apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://dl.gitea.com/charts/'
    chart: gitea
    targetRevision: '12.7.0'
    helm:
      values: |
        valkey:
          enabled: false
        cloudnativePG:
          enabled: false

        persistence:
          enabled: false

        gatewayAPI:
          enabled: true
          core:
            httpRoute:
              enabled: true
              parentRefs:
                - name: lab
                  namespace: platform
                  sectionName: http
              hostnames:
                - gitea.127.0.0.1.nip.io

        gitea:
          config:
            server:
              DOMAIN: gitea.127.0.0.1.nip.io
              ROOT_URL: http://gitea.127.0.0.1.nip.io/
              SSH_DOMAIN: gitea.127.0.0.1.nip.io
            database:
              DB_TYPE: sqlite3
            session:
              PROVIDER: memory
            cache:
              ADAPTER: memory
            queue:
              TYPE: level
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
