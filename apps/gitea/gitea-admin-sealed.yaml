---
# Sealed with the lab's sealed-secrets key from cncf-lab/gitops/sealed-secrets-key.yaml.
# This keeps the chart and the bootstrap Job on the same admin credential.
# Rotate it by creating a new Secret and re-running kubeseal for namespace gitea.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gitea-admin
  namespace: gitea
  annotations:
    # Create the Secret before the Gitea Deployment starts.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: gitea-admin
      namespace: gitea
    type: Opaque
