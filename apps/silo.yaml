apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: silo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/pgsty/silo.git'
    path: helm/silo
    targetRevision: 'RELEASE.2026-10-18T00-00-00Z'
    helm:
      values: |
        mode: 'standalone'
        persistence:
          enabled: false
        resources:
          requests:
            memory: 256Mi
        buckets:
          - name: workflows
            policy: none
            purge: false
            versioning: false
            objectlocking: false
        users:
          - accessKey: silo-workflows-secret
            existingSecret: user
            existingSecretKey: password
            policy: readwrite
        svcaccts:
          - accessKey: silo-workflows-secret
            existingSecret: user
            existingSecretKey: password
            user: argo
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
