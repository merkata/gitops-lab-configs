apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/merkata/gitops-lab-configs.git'
    targetRevision: HEAD
    path: apps/cicd
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The sealed-secrets CRD is installed by base-apps. Skip the dry-run if
      # this app is reconciled before the CRD is visible to discovery.
      - SkipDryRunOnMissingResource=true
