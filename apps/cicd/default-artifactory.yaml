apiVersion: v1
kind: ConfigMap
metadata:
  # If you want to use this config map by default, name it "artifact-repositories". Otherwise, you can provide a reference to a
  # different config map in `artifactRepositoryRef.configMap`.
  name: artifact-repositories
  namespace: argo-workflows
  annotations:
    # If you want to use a specific key, put that key into this annotation.
    workflows.argoproj.io/default-artifact-repository: default-v1-s3-artifact-repository
data:
  default-v1-s3-artifact-repository: |
    s3:
      accessKeySecret:
        name: silo-svcact
        key: user
      secretKeySecret:
        name: silo-svcact
        key: password
      insecure: true
      bucket: workflows
      endpoint: silo.silo.svc.cluster.local:9000
