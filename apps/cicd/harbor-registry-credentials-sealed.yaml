---
# Robot credentials consumed by the clone-and-build WorkflowTemplate.
# This is the argo-workflows namespace copy; the Harbor namespace copy is used
# by the Harbor bootstrap Job to set the robot password. Keep both in sync.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-registry-credentials
  namespace: argo-workflows
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: harbor-registry-credentials
      namespace: argo-workflows
    type: Opaque
