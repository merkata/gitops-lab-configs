apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workflows
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://argoproj.github.io/argo-helm'
    chart: argo-workflows
    targetRevision: '2.0.13'
    helm:
      values: |
        s3:
          accessKeySecret:
            name: silo-svcact
            key: user
          secretKeySecret:
            name: silo-svcact
            key: password
          insecure: true
          bucket: workflows
          endpoint: http://silo.silo.svc.cluster.local:9000
        server:
          authModes: [server]
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
