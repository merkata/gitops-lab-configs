apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/merkata/gitops-lab-configs.git'
      targetRevision: HEAD
      path: apps/base
    # Keep the SealedSecrets CRD in this Application, alongside the SealedSecret
    # resources. Argo CD performs a dry-run of all manifests in an Application
    # before applying anything; if the CRD is part of the same sync, Argo CD
    # knows the SealedSecret kind and orders the CRD first.
    # Keep this tag aligned with the sealed-secrets chart appVersion:
    # chart 2.20.0 -> sealed-secrets 0.40.0.
    - repoURL: 'https://github.com/bitnami-labs/sealed-secrets.git'
      targetRevision: 'v0.40.0'
      path: helm/sealed-secrets/crds
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
