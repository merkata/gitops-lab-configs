apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus
    targetRevision: '29.*'
    helm:
      values: |
        server:
          extraFlags:
            - "web.enable-otlp-receiver"
            - "web.enable-remote-write-receiver"
          route:
            main:
              enabled: true
              parentRefs:
                - name: lab
                  namespace: platform
                  sectionName: http
              hostnames:
                - prometheus.127.0.0.1.nip.io
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
