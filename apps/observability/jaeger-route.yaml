apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: lab
      namespace: platform
      sectionName: http
  hostnames:
    - jaeger.127.0.0.1.nip.io
  rules:
    - backendRefs:
        - name: jaeger
          port: 16686
