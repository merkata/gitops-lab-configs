---
# Robot credentials for the Harbor bootstrap Job.
# This must contain the same username/password as the copy in
# apps/cicd/harbor-registry-credentials-sealed.yaml (argo-workflows).
# The Job PATCHes the Harbor robot account to this fixed secret.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-registry-credentials
  namespace: harbor
  annotations:
    # Create the Secret before the Harbor chart resources start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: harbor-registry-credentials
      namespace: harbor
    type: Opaque
