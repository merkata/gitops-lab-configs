---
# Harbor admin credentials used by the chart and the bootstrap Job.
# Sealed with the lab key from cncf-lab/gitops/sealed-secrets-key.yaml.
# Replace the password and re-seal to rotate it.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-admin
  namespace: harbor
  annotations:
    # Create the Secret before the Harbor chart resources start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    HARBOR_ADMIN_PASSWORD: 
  template:
    metadata:
      name: harbor-admin
      namespace: harbor
    type: Opaque
