apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: argo-events
  dependencies:
    - name: app-dep
      eventSourceName: webhook
      eventName: app
  triggers:
    - template:
        name: webhook-workflow-trigger
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: webhook-app-
                namespace: argo-workflows
              spec:
                entrypoint: clone-and-build
                arguments:
                  parameters:
                    - name: body
                      value: hello world
                workflowTemplateRef:
                  name: clone-and-build
          parameters:
            - src:
                dependencyName: app-dep
                dataKey: body
              dest: spec.arguments.parameters.0.value
