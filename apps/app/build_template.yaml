apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: clone-and-build
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflow
  entrypoint: clone
  templates:
    - name: clone
      inputs:
        artifacts:
          - name: app-source
            path: /src
            git:
              repo: http://gitea-http.gitea.svc.cluster.local:3000/gitea_admin/app.git
      container:
        image: busybox
        command: [sh, -c]
        args: ["echo Building; cd /src; ls"]
        workingDir: /src
