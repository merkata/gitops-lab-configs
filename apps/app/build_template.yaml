apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: clone-and-build
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflow
  entrypoint: clone-and-build
  templates:
    - name: clone-and-build
      inputs:
        artifacts:
          - name: app-source
            path: /src
            git:
              repo: http://gitea-http.gitea.svc.cluster.local:3000/gitea_admin/app.git
      outputs:
        artifacts:
          - name: app-image
            path: /tmp/image.tar
            s3:
              key: app-image
      metadata:
        annotations:
          container.apparmor.security.beta.kubernetes.io/main: unconfined
      container:
        image: moby/buildkit:rootless
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p ~/.config/buildkit
            cat <<EOF > ~/.config/buildkit/buildkitd.toml
            [registry."harbor-registry.harbor.svc.cluster.local:5000"]
              http = true
              insecure = true
            EOF
            mkdir -p ~/.docker
            B64_AUTH=$(echo -n "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" | base64 | tr -d '\n')
            cat <<EOF > ~/.docker/config.json
            {
              "auths": {
                "harbor-registry.harbor.svc.cluster.local:5000": {
                  "auth": "${B64_AUTH}"
                }
              }
            }
            EOF
            exec buildctl-daemonless.sh build \
              --frontend=dockerfile.v0 \
              --local context=/src \
              --local dockerfile=/src \
              --output type=docker,dest=/tmp/image.tar \
              --output type=image,name=harbor-registry.harbor.svc.cluster.local:5000/app/app-image:latest,push=true
        #command: [buildctl-daemonless.sh]
        env:
          - name: BUILDKITD_FLAGS
            value: --oci-worker-no-process-sandbox
          - name: HARBOR_USERNAME
            valueFrom:
              secretKeyRef:
                name: harbor-registry-credentials
                key: username
          - name: HARBOR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: harbor-registry-credentials
                key: password
        #args:
        #  - build
        #  - --frontend=dockerfile.v0
        #  - --local
        #  - context=/src
        #  - --local
        #  - dockerfile=/src
        #  - --output
        #  - type=docker,dest=/tmp/image.tar
        #  - --output
        #  - type=image,name=harbor-registry.harbor.svc.cluster.local:5000/app/app-image:latest,push=true
        workingDir: /src
