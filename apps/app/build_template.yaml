apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: clone-and-build
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflow
  entrypoint: clone-and-build
  templates:
    - name: clone-and-build
      inputs:
        artifacts:
          - name: app-source
            path: /src
            git:
              repo: http://gitea-http.gitea.svc.cluster.local:3000/gitea_admin/app.git
      outputs:
        artifacts:
          - name: app-image
            path: /src/image.tar
            s3:
              key: app-image
      metadata:
        annotations:
          container.apparmor.security.beta.kubernetes.io/main: unconfined
      container:
        image: moby/buildkit:rootless
        command: [buildctl-daemonless.sh]
        args:
          - build
          - --output
          - type=docker,dest=/src/image.tar
        workingDir: /src
