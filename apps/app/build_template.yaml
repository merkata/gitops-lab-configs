apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: clone-and-build
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflow
  entrypoint: clone-and-build
  arguments:
    parameters:
      - name: body
        value: v1
  templates:
    - name: clone-and-build
      inputs:
        parameters:
          - name: body
            value: {{ workflow.parameters.body }}
        artifacts:
          - name: app-source
            path: /src
            git:
              repo: http://gitea-http.gitea.svc.cluster.local:3000/gitea_admin/app.git
      outputs:
        artifacts:
          - name: app-image
            path: /tmp/image.tar
            s3:
              key: app-image
      metadata:
        annotations:
          container.apparmor.security.beta.kubernetes.io/main: unconfined
      container:
        image: moby/buildkit:rootless
        command: ["/bin/sh", "-c"]
        args:
          - |
            # NOTE: project "app" must exist in Harbor (Harbor does not create projects
            # on push). Create it in the UI/API before running this template, or use
            # the default "library" project in the image name below.
            # Push through Harbor's nginx/core service (service "harbor", port 80).
            # Do NOT push to harbor-registry:5000: that is the internal distribution
            # registry, which only understands the registry htpasswd user and bypasses
            # Harbor's authentication/project checks.
            mkdir -p ~/.config/buildkit
            cat <<EOF > ~/.config/buildkit/buildkitd.toml
            [registry."harbor.harbor.svc.cluster.local"]
              http = true
              insecure = true
            EOF
            mkdir -p ~/.docker
            B64_AUTH=$(echo -n "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" | base64 | tr -d '\n')
            cat <<EOF > ~/.docker/config.json
            {
              "auths": {
                "harbor.harbor.svc.cluster.local": {
                  "auth": "${B64_AUTH}"
                }
              }
            }
            EOF
            exec buildctl-daemonless.sh build \
              --frontend=dockerfile.v0 \
              --local context=/src \
              --local dockerfile=/src \
              --output type=docker,dest=/tmp/image.tar \
              --output type=image,name=harbor.harbor.svc.cluster.local/app/app-image:{{ inputs.parameters.body.ref }},push=true
        env:
          - name: BUILDKITD_FLAGS
            value: --oci-worker-no-process-sandbox --config /home/user/.config/buildkit/buildkitd.toml
          - name: HARBOR_USERNAME
            valueFrom:
              secretKeyRef:
                name: harbor-registry-credentials
                key: username
          - name: HARBOR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: harbor-registry-credentials
                key: password
        workingDir: /src
