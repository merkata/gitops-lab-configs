apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  # The Gateway must be in the same namespace as the manually deployed Istio
  # ingress gateway Service it references below.
  namespace: istio-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  gatewayClassName: istio
  # Link this Gateway to the istio/gateway Helm chart's Service. This is the
  # manual-deployment path: istiod will not create another Deployment/Service.
  addresses:
    - type: Hostname
      value: istio-ingress.istio-ingress.svc.cluster.local
  listeners:
    - name: http
      protocol: HTTP
      # This must match the Service port (80), not the Envoy container port.
      port: 80
      allowedRoutes:
        namespaces:
          from: All
