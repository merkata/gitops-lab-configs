apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  parentRefs:
    - name: lab
      namespace: platform
      sectionName: http
  hostnames:
    - argocd.127.0.0.1.nip.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
