apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  parentRefs:
    - name: lab
      namespace: platform
      sectionName: http
  hostnames:
    - hubble.127.0.0.1.nip.io
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
