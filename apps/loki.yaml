apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana-community.github.io/helm-charts'
    chart: loki
    targetRevision: '18.*'
    helm:
      values: |
        loki:
          commonConfig:
            replication_factor: 1
          auth_enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
